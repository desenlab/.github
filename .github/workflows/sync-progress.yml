name: Check DESEN progress

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - desen-progress-updated
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: sync-desen-progress
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the organization profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize public progress
        run: node scripts/sync-progress.mjs

      - name: Require the checked-in profile to be current
        run: git diff --exit-code -- profile/README.md
