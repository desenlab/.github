name: Sync DESEN progress

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - desen-progress-updated
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-desen-progress
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the organization profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize public progress
        run: node scripts/sync-progress.mjs

      - name: Commit an updated profile
        run: |
          git config user.name "Selman Ay"
          git config user.email "51993713+selmanays@users.noreply.github.com"
          git add profile/README.md
          if git diff --cached --quiet; then
            echo "No progress change."
            exit 0
          fi
          git commit -m "Update DESEN progress"
          git push
