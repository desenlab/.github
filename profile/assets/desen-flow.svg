<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Traditional handoff compared with the DESEN delivery flow</title>
  <desc id="description">The traditional flow moves from a design file through handoff to React reconstruction. The DESEN flow moves from trusted capabilities through a DESEN source and validated bundle to an application runtime.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131b"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="desen-node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#697080"/>
    </marker>
    <marker id="arrow-desen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#8b7fff"/>
    </marker>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <text x="48" y="52" fill="#f4f5f7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="650">From handoff to executable design</text>

  <text x="48" y="121" fill="#9ba1ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="1.1">TRADITIONAL</text>

  <rect x="210" y="88" width="220" height="66" rx="14" fill="#171a22" stroke="#3b404c"/>
  <text x="320" y="128" text-anchor="middle" fill="#d5d8de" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Design file</text>
  <path d="M446 121H500" fill="none" stroke="#697080" stroke-width="2" marker-end="url(#arrow-muted)"/>

  <rect x="516" y="88" width="188" height="66" rx="14" fill="#171a22" stroke="#3b404c"/>
  <text x="610" y="128" text-anchor="middle" fill="#d5d8de" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Handoff</text>
  <path d="M720 121H774" fill="none" stroke="#697080" stroke-width="2" marker-end="url(#arrow-muted)"/>

  <rect x="790" y="88" width="330" height="66" rx="14" fill="#171a22" stroke="#6b3f3f"/>
  <text x="955" y="128" text-anchor="middle" fill="#e4c7c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">React reconstruction</text>

  <line x1="48" y1="205" x2="1232" y2="205" stroke="#242934"/>

  <text x="48" y="282" fill="#a79fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1">DESEN</text>

  <rect x="162" y="248" width="205" height="68" rx="14" fill="url(#desen-node)" stroke="#9288ff"/>
  <text x="264.5" y="289" text-anchor="middle" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Capabilities</text>
  <path d="M383 282H419" fill="none" stroke="#8b7fff" stroke-width="2.5" marker-end="url(#arrow-desen)"/>

  <rect x="435" y="248" width="210" height="68" rx="14" fill="#202038" stroke="#756bdf"/>
  <text x="540" y="289" text-anchor="middle" fill="#f0eeff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">DESEN source</text>
  <path d="M661 282H697" fill="none" stroke="#8b7fff" stroke-width="2.5" marker-end="url(#arrow-desen)"/>

  <rect x="713" y="248" width="228" height="68" rx="14" fill="#202038" stroke="#756bdf"/>
  <text x="827" y="289" text-anchor="middle" fill="#f0eeff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Validated bundle</text>
  <path d="M957 282H993" fill="none" stroke="#8b7fff" stroke-width="2.5" marker-end="url(#arrow-desen)"/>

  <rect x="1009" y="248" width="210" height="68" rx="14" fill="#202038" stroke="#756bdf"/>
  <text x="1114" y="289" text-anchor="middle" fill="#f0eeff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">App runtime</text>

  <text x="640" y="372" text-anchor="middle" fill="#9ba1ad" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Designers compose the experience · Developers define trusted capabilities</text>
</svg>
